name: Keep Render Service Alive

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Web Service
        env:
          TARGET_URL: ${{ secrets.APP_URL }}
        run: |
          # Use secrets.APP_URL if defined, otherwise fallback to placeholder notice
          if [ -z "$TARGET_URL" ]; then
            echo "APP_URL secret is not set yet in GitHub repository secrets."
            echo "Once you deploy to Render, add your live URL to GitHub Repo Settings -> Secrets and variables -> Actions -> APP_URL"
            exit 0
          fi

          echo "Pinging: $TARGET_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
          echo "Received response HTTP status: $STATUS_CODE"
